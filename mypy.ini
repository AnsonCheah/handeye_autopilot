# mypy runs on the ROS-free core only (01-architecture §12).
[mypy]
python_version = 3.12
files = handeye_autopilot/handeye_autopilot/core, handeye_autopilot/handeye_autopilot/__init__.py
strict = True
ignore_missing_imports = True

# OpenCV's bundled stubs are partial and differ between 4.6 and 4.10 (4.6 has
# none); treat cv2 as untyped so results don't depend on the installed version.
[mypy-cv2.*]
follow_imports = skip
