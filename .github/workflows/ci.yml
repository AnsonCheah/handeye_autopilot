name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy numpy
      - run: ruff check .
      - run: mypy

  build-and-test:
    name: ${{ matrix.ros_distribution }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distribution: jazzy
            docker_image: ubuntu:noble
          - ros_distribution: lyrical
            docker_image: ubuntu:resolute
          # Rolling targets resolute; its binaries are in ros2-testing only so far
          # (checked 2026-11-26). Drop use_testing once they sync to main.
          - ros_distribution: rolling
            docker_image: ubuntu:resolute
            use_testing: true
    env:
      HANDEYE_AUTOPILOT_REQUIRE_DEPS: '1'
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}
          use-ros2-testing: ${{ matrix.use_testing || false }}
      # Dependency gate (03-milestones M0): every key must resolve to an apt
      # package in a clean container; pip installs are not allowed.
      # One commit for everything: the gate, action-ros-ci's own checkout and
      # the consumer (PR head SHA on pull requests, the pushed SHA otherwise).
      - uses: actions/checkout@v4
        with:
          path: src/handeye_autopilot
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Dependency gate (every key resolves to apt, checked before install)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          rosdep update --rosdistro ${{ matrix.ros_distribution }}
          src/handeye_autopilot/ci/scripts/check_deps.sh src ${{ matrix.ros_distribution }} \
            src/handeye_autopilot/ci/known_missing.txt skip_keys.txt
          rosdep install --from-paths src -i -y --rosdistro ${{ matrix.ros_distribution }} \
            --skip-keys "$(cat skip_keys.txt)"
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: handeye_autopilot handeye_autopilot_interfaces handeye_autopilot_demos
          target-ros2-distro: ${{ matrix.ros_distribution }}
          # Installed (not symlink) build, as released packages are (01-architecture §4).
          no-symlink-install: true
          skip-rosdep-install: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # M0 done-when: a separate downstream package uses the installed interfaces.
      - name: Downstream consumer (CI only)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          source ros_ws/install/setup.bash
          mkdir -p consumer_ws/src
          cp -r src/handeye_autopilot/ci/interface_consumer consumer_ws/src/
          cd consumer_ws
          colcon build
          colcon test --return-code-on-test-failure
          colcon test-result --verbose
